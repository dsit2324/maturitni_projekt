{% extends 'base.html' %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 40px auto;">
    <h2>Registrace</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="field">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="muted">{{ field.errors|join:', ' }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn">Registrovat</button>
    </form>
</div>
{% endblock %}
