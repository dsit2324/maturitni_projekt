{% load static %}
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Helpdesk</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-inner">
            <div class="brand-block">
                <span class="brand-mark">IT</span>
                <span>Helpdesk</span>
            </div>
            <div class="nav-links">
                {% if user.is_authenticated %}
                    <a href="{% url 'dashboard' %}">Dashboard</a>
                    <a href="{% url 'ticket_list' %}">Požadavky</a>
                    <a href="{% url 'create_ticket' %}">Nový požadavek</a>
                    <a href="{% url 'logout' %}" class="nav-logout">Odhlásit se</a>
                {% else %}
                    <a href="{% url 'login' %}">Přihlásit se</a>
                    <a href="{% url 'register' %}" class="btn btn-nav">Registrovat</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
