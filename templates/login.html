{% extends 'base.html' %}

{% block content %}
<div class="auth-card">
    <div class="auth-header">
        <p class="eyebrow">Vítejte zpět</p>
        <h2>Přihlášení</h2>
    </div>
    <form method="post" class="auth-form">
        {% csrf_token %}
        <div class="field">
            <label for="username">Uživatelské jméno</label>
            <input type="text" name="username" id="username" required>
        </div>
        <div class="field">
            <label for="password">Heslo</label>
            <input type="password" name="password" id="password" required>
        </div>
        <button type="submit" class="btn btn-block">Přihlásit se</button>
    </form>
    <p class="auth-footer">Nemáte účet? <a href="{% url 'register' %}">Registrovat</a></p>
</div>
{% endblock %}
