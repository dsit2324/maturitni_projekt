{% extends 'base.html' %}

{% block content %}
<div class="auth-card auth-card-wide">
    <div class="auth-header">
        <p class="eyebrow">Nový požadavek</p>
        <h2>{{ title }}</h2>
    </div>
    <form method="post" class="auth-form">
        {% csrf_token %}
        {% for field in form %}
            <div class="field">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="form-error">{{ field.errors|join:', ' }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-block">Uložit</button>
    </form>
</div>
{% endblock %}
